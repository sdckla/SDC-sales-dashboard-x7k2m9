name: 대시보드 자동 업데이트 (구글 시트 → GitHub Pages)

on:
  schedule:
    # 매일 3번 실행 (출근 시 전날 데이터를 확인할 수 있도록). GitHub 예약 작업은 서버가 붐비면 몇 시간씩 늦어질 수 있어,
    # 한 번이 밀려도 다음 실행이 보완하도록 간격을 두고 여러 번 예약함. 매 실행마다 갱신 시각이 기록되어 하루 3번 커밋이 생기지만 데이터에는 영향이 없음.
    # UTC 21:15 = 우간다 00:15 / UTC 00:15 = 우간다 03:15 / UTC 03:15 = 우간다 06:15
    - cron: "15 21 * * *"
    - cron: "15 0 * * *"
    - cron: "15 3 * * *"
  workflow_dispatch: {} # 저장소의 Actions 탭에서 "Run workflow" 버튼으로 수동 실행도 가능

concurrency:
  group: update-dashboard # 지연된 실행이 겹쳐도 한 번에 하나씩만 돌도록 함
  cancel-in-progress: false

permissions:
  contents: write # index.html / dashboard.jsx 를 저장소에 커밋하기 위해 필요

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 패키지 설치
        run: npm ci

      - name: 구글 시트에서 데이터 가져와 대시보드 재생성
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          SELLING_DATA_SHEET_ID: ${{ secrets.SELLING_DATA_SHEET_ID }}
          DAILY_REPORT_SHEET_ID: ${{ secrets.DAILY_REPORT_SHEET_ID }}
        run: node scripts/buildDashboard.js

      - name: 변경 사항 커밋 및 푸시
        run: |
          git config user.name "sdc-dashboard-bot"
          git config user.email "actions@github.com"
          git add index.html dashboard.jsx
          if git diff --cached --quiet; then
            echo "변경 사항 없음 — 커밋하지 않음"
          else
            git commit -m "자동 업데이트: 구글 시트 데이터 반영 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
