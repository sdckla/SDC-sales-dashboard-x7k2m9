name: 대시보드 자동 업데이트 (구글 시트 → GitHub Pages)

on:
  schedule:
    # 매일 UTC 03:00 = 우간다 현지시간(EAT, UTC+3) 06:00 에 실행
    - cron: "0 3 * * *"
  workflow_dispatch: {} # 저장소의 Actions 탭에서 "Run workflow" 버튼으로 수동 실행도 가능

permissions:
  contents: write # index.html / dashboard.jsx 를 저장소에 커밋하기 위해 필요

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 패키지 설치
        run: npm ci

      - name: 구글 시트에서 데이터 가져와 대시보드 재생성
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          SELLING_DATA_SHEET_ID: ${{ secrets.SELLING_DATA_SHEET_ID }}
          DAILY_REPORT_SHEET_ID: ${{ secrets.DAILY_REPORT_SHEET_ID }}
        run: node scripts/buildDashboard.js

      - name: 변경 사항 커밋 및 푸시
        run: |
          git config user.name "sdc-dashboard-bot"
          git config user.email "actions@github.com"
          git add index.html dashboard.jsx
          if git diff --cached --quiet; then
            echo "변경 사항 없음 — 커밋하지 않음"
          else
            git commit -m "자동 업데이트: 구글 시트 데이터 반영 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
